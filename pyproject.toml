[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakhound"
version = "1.0.0"
description = "Find leaked secrets (API keys, tokens, private keys, passwords) in source trees and git history."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TD" }]
keywords = ["security", "secrets", "secret-scanning", "devsecops", "sarif", "git"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
leakhound = "leakhound.cli:main"

[tool.setuptools.packages.find]
include = ["leakhound*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
